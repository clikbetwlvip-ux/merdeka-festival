<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CLICKBET88 Anime Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="screen active">

        <div class="loading-content">

            <img
                class="loading-logo"
                src="https://clickbet88sedekahrejeki05.xyz/storage/webpersonalize/d54f5304-03b3-49f7-b283-e6fe0c595ca7.gif"
                alt="CLICKBET88"
            >

            <h2>MEMUAT DUNIA ANIME</h2>

            <div class="loading-bar">
                <div id="loading-progress"></div>
            </div>

            <p id="loading-text">0%</p>

        </div>

    </div>


    <!-- START SCREEN -->
    <main id="start-screen" class="screen">

        <div class="background-overlay"></div>

        <div class="start-content">

            <img
                class="main-logo"
                src="https://clickbet88sedekahrejeki05.xyz/storage/webpersonalize/d54f5304-03b3-49f7-b283-e6fe0c595ca7.gif"
                alt="CLICKBET88"
            >

            <div class="game-title">
                <span>WELCOME TO</span>
                <h1>ANIME ADVENTURE</h1>
                <p>Masuki dunia fantasi dan taklukkan setiap tantangan!</p>
            </div>

            <button id="start-button" class="start-button">
                MULAI PETUALANGAN
            </button>

            <p class="version">Version 1.0.0</p>

        </div>

    </main>


    <!-- LOBBY SEMENTARA -->
    <section id="lobby-screen" class="screen">

        <div class="lobby-header">

            <div class="player-info">
                <div class="avatar">A</div>

                <div>
                    <h3 id="player-name">Guest</h3>
                    <p>Level <span id="player-level">1</span></p>
                </div>
            </div>

            <div class="currency">
                <span>🪙 <b id="player-coin">1000</b></span>
                <span>🎟️ <b id="player-ticket">3</b></span>
            </div>

        </div>

        <div class="lobby-content">

            <h1>LOBBY GAME</h1>
            <p>Pilih permainan yang ingin dimainkan.</p>

            <div class="game-grid">

                <button class="game-card" data-game="slash">
                    <span class="game-icon">⚔️</span>
                    <h3>Anime Slash</h3>
                    <p>Segera hadir</p>
                </button>

                <button class="game-card" data-game="boss">
                    <span class="game-icon">👹</span>
                    <h3>Boss Battle</h3>
                    <p>Segera hadir</p>
                </button>

                <button class="game-card" data-game="treasure">
                    <span class="game-icon">🎁</span>
                    <h3>Treasure Box</h3>
                    <p>Segera hadir</p>
                </button>

            </div>

        </div>

    </section>


    <script src="data.js"></script>
    <script src="game.js"></script>
    <script src="script.js"></script>

</body>
</html>
