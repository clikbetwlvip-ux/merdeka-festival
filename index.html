<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panjat Pinang CLICKBET88</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>
  <div class="background-overlay"></div>

  <header class="topbar">

    <div class="logo-box">
      <span class="logo-click">CLICK</span>
      <span class="logo-bet">BET88</span>
    </div>

    <div class="player-status" id="statusBadge">
      <span>ID PEMAIN</span>
      <strong>BELUM LOGIN</strong>
    </div>

  </header>

  <main class="page-wrapper">

    <section class="login-card">

      <div class="event-label">
        EVENT KEMERDEKAAN 2026
      </div>

      <h1>
        <span>PANJAT</span>
        <span>PINANG</span>
        <strong>CLICKBET88</strong>
      </h1>

      <p class="description">
        Masukkan ID yang sudah didaftarkan admin untuk memulai
        petualangan dan raih hadiahmu.
      </p>

      <form id="loginForm" autocomplete="off">

        <label for="playerId">
          ID MEMBER
        </label>

        <div class="form-row">

          <input
            type="text"
            id="playerId"
            maxlength="20"
            placeholder="Masukkan ID pemain"
          >

          <button
            type="submit"
            id="loginBtn"
            disabled
          >
            <span class="btn-text">MASUK GAME</span>
            <span class="loading-dot"></span>
          </button>

        </div>

        <p class="form-note">
          ID wajib dibuat dan diaktifkan melalui Admin Panel
        </p>

        <p class="error-message" id="errorMessage"></p>

      </form>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
