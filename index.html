<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CLICKBET88 | Arena Lomba</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<div class="container">

    <!-- KIRI -->

    <div class="left">

        <div class="logo">

            CLICKBET<span>88</span>

        </div>

        <h4>EVENT KEMERDEKAAN 2026</h4>

        <h1>PANJAT PINANG</h1>

        <div class="badge">

            17 AGUSTUS

        </div>

        <p>

            Masuk ke arena, kalahkan lawan,
            panjat tiang hingga puncak,
            lalu buka Mystery Box untuk
            mendapatkan hadiah.

        </p>

    </div>

    <!-- KANAN -->

    <div class="right">

        <div class="login-card">

            <h2>MASUK KE ARENA</h2>

            <label>ID MEMBER</label>

            <input
            type="text"
            id="memberID"
            placeholder="Masukkan ID Member">

            <button id="loginBtn">

                MASUK KE ARENA

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
