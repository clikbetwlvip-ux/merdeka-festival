<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panjat Pinang CLICKBET88 - Event Kemerdekaan 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-image"></div>
  <div class="particles" id="particles"></div>

  <main class="container">
    <div class="pole-scene">
      <div class="pole"></div>
      <div class="rope">
        <div class="gift-box">
          <div class="box-body">
            <span class="gift-logo">CLICKBET88</span>
          </div>
          <div class="box-lid"></div>
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
          <div class="bow"></div>
        </div>
      </div>
  <div class="flag">
  <svg viewBox="0 0 60 40" class="flag-svg">
    <rect width="60" height="20" y="0" fill="#ff0000"/>
    <rect width="60" height="20" y="20" fill="#ffffff"/>
  </svg>
</div>
    </div>

    <div class="card">
      <div class="brand">
        <div class="logo-ring">
          <span class="logo-text">CLICKBET88</span>
        </div>
        <h1 class="title">
          <span class="title-main">PANJAT PINANG</span>
          <span class="title-sub">Event Kemerdekaan 2026</span>
        </h1>
      </div>

      <div class="status-badge" id="statusBadge">ID PEMAIN BELUM LOGIN</div>

      <form id="loginForm" class="form" autocomplete="off">
        <label for="playerId">ID Member / Username</label>
        <div class="input-wrap">
          <input
            type="text"
            id="playerId"
            placeholder="Masukkan ID member kamu"
            maxlength="20"
          />
          <span class="input-icon">👤</span>
        </div>

        <button type="submit" id="loginBtn" class="btn-login" disabled>
          <span class="btn-text">MASUK GAME</span>
          <span class="btn-shine"></span>
        </button>
      </form>

      <p class="footer-text">
        Belum punya akun? <a href="#" class="link">Daftar sekarang</a>
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
