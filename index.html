<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICKBET88 - Panjat Pinang</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div id="loadingScreen" class="screen hidden">
    <div class="loading-box">
        <h1>MEMASUKI ARENA...</h1>
        <div class="loading-bar">
            <div id="loadingFill"></div>
        </div>
    </div>
</div>

<div id="loginScreen" class="screen">

    <div class="left">

        <h4>EVENT KEMERDEKAAN</h4>

        <h1>PANJAT PINANG</h1>

        <p>

            Masuk ke arena.

            Panjat hingga puncak.

            Buka Mystery Box.

            Raih hadiah.

        </p>

    </div>

    <div class="right">

        <div class="card">

            <h2>MASUK ARENA</h2>

            <input
                id="memberID"
                placeholder="Masukkan ID Member">

            <button id="loginBtn">

                MULAI BERMAIN

            </button>

        </div>

    </div>

</div>

<div id="gameScreen" class="screen hidden">

    <div class="header">

        <h1>PANJAT PINANG</h1>

    </div>

    <div class="arena">

        <div id="box">

            🎁

        </div>

        <div id="pole"></div>

        <div id="player">

            🧍

        </div>

    </div>

    <div class="progress">

        <div id="progressFill"></div>

    </div>

    <button id="climbBtn">

        PANJAT

    </button>

</div>

<div id="rewardScreen" class="screen hidden">

    <h1>

        🎉 SELAMAT 🎉

    </h1>

    <h2 id="rewardText">

    </h2>

    <button onclick="location.reload()">

        MAIN LAGI

    </button>

</div>

<script src="script.js"></script>

</body>
</html>
