<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLICKBET88 | Arena Lomba</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="container">

    <!-- KIRI -->

    <div class="left">

        <img src="https://dummyimage.com/320x90/cc0000/ffffff&text=CLICKBET88"
        class="logo">

        <h1>ARENA LOMBA</h1>

        <div class="badge">

            17 AGUSTUS

        </div>

        <p>

            Masuk ke arena,
            kalahkan lawan,
            lalu pilih satu Mystery Box
            setelah menang.

        </p>

    </div>

    <!-- KANAN -->

    <div class="right">

        <div class="card">

            <h2>

                MASUK KE ARENA

            </h2>

            <label>

                ID MEMBER

            </label>

            <input
            type="text"
            id="memberID"
            placeholder="Masukkan ID Member">

            <button id="loginBtn">

                MASUK KE ARENA

            </button>

            <button class="back">

                KEMBALI

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
